name: GUI checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned REA CLI
        run: npm install --no-audit --no-fund
      - name: Syntax
        run: npm run check
      - name: Shell scripts syntax
        run: bash -n scripts/*.sh
      - name: API tests
        run: npm test
