name: GUI checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned REA CLI
        run: npm install --no-audit --no-fund
      - name: Syntax
        run: npm run check
      - name: Shell scripts syntax
        run: bash -n scripts/*.sh
      - name: API tests
        run: npm test
      - name: Real REA Linux-compatible APK artifact smoke test
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('/tmp/rea-smoke.apk','w') as z:
              z.writestr('AndroidManifest.xml', '<manifest package="org.example.reasmoke"/>')
          PY
          if ! timeout 90s ./node_modules/.bin/rea inspect-artifact /tmp/rea-smoke.apk --json > /tmp/rea-smoke.json 2>/tmp/rea-smoke.err; then
            echo 'REA reported failure:'
            cat /tmp/rea-smoke.err
            head -c 4000 /tmp/rea-smoke.json
            exit 1
          fi
          node - <<'NODE'
          const x=JSON.parse(require('node:fs').readFileSync('/tmp/rea-smoke.json','utf8'));
          if (!x || typeof x!=='object') process.exit(2);
          console.log('REA scanner keys:', Object.keys(x).join(', '));
          console.log('REA summary:', JSON.stringify({normal:x.normalized_result, raw:x.raw_result, limitations:x.limitations}).slice(0, 2500));
          NODE
      - name: Probe real APK and SQLite support matrix
        run: |
          python3 - <<'PY'
          import sqlite3
          c=sqlite3.connect('/tmp/rea-smoke.sqlite')
          c.execute('CREATE TABLE demo (id INTEGER PRIMARY KEY, title TEXT NOT NULL)')
          c.execute('INSERT INTO demo (title) VALUES (?)', ('REA test',))
          c.commit()
          c.close()
          PY
          for entry in 'inspect-android-package /tmp/rea-smoke.apk' 'identify-flutter-build /tmp/rea-smoke.apk' 'inspect-sqlite-database /tmp/rea-smoke.sqlite'; do
            set -- $entry
            echo "--- REA $1 ---"
            if timeout 45s ./node_modules/.bin/rea "$1" "$2" --json > /tmp/rea-probe.json 2>/tmp/rea-probe.err; then
              node -e "const x=JSON.parse(require('node:fs').readFileSync('/tmp/rea-probe.json','utf8'));console.log(JSON.stringify({ok:true,keys:Object.keys(x),format:x.format||null}).slice(0,500))"
            else
              head -c 600 /tmp/rea-probe.err
              head -c 600 /tmp/rea-probe.json
            fi
            echo
          done

      - name: End-to-end real REA worker smoke test
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { runFreeAnalysis } from './src/free-worker.mjs';
          const target='/tmp/rea-smoke.apk';
          const filename='rea-smoke.apk';
          const sha256=createHash('sha256').update(readFileSync(target)).digest('hex');
          const reportPath='/tmp/rea-worker-report.md';
          const observed=[];
          const result=await runFreeAnalysis({target,filename,sha256,reportPath,question:'Inspecter les composants de cet APK de test',log:s=>observed.push(s)});
          if (!result.ok || !existsSync(reportPath)) throw new Error('REA worker did not produce a verified report: '+JSON.stringify(result)+' logs '+observed.join('|'));
          const report=readFileSync(reportPath,'utf8');
          if (!report.includes('evidence_id') || !report.includes('normalized_result')) throw new Error('REA report lost canonical evidence');
          console.log('Real worker outcome',JSON.stringify(result),'report bytes',report.length);
          NODE

      - name: Real REA plus simulated Jev API orchestration integration
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { runFreeAnalysis } from './src/free-worker.mjs';
          process.env.CODIV_API_KEY = 'ci-only-fake-server-credential-123';
          let typedCalls=0;
          globalThis.fetch = async (url, options) => {
            if (String(url).endsWith('/v1/systemone')) {
              typedCalls++;
              const body = JSON.parse(options.body);
              if (body.model !== 'openjev-0.1') throw new Error('wrong model');
              const answers = Object.fromEntries(Object.entries(body.questions).map(([id,q]) => [
                id, q.type === 'choice'
                  ? {type:'choice',choice:Object.keys(q.criteria)[0],confidence:0.92,probabilities:{}}
                  : {type:'noul',noul:0.88}
              ]));
              return {ok:true,json:async()=>({model:'openjev-0.1',answers,usage:{input_tokens:10}})};
            }
            if (String(url).endsWith('/v1/chat/completions'))
              return {ok:true,json:async()=>({choices:[{message:{content:'Inference de test, pas une preuve.'}}]})};
            throw new Error('Unexpected outbound request '+url);
          };
          const target='/tmp/rea-smoke.apk';
          const sha256=createHash('sha256').update(readFileSync(target)).digest('hex');
          const path='/tmp/rea-jev-integrated.md';
          const result=await runFreeAnalysis({
            target, filename:'rea-smoke.apk', sha256, reportPath:path,
            question:'Analyser cet APK et classifier les observations REA'
          });
          const report=readFileSync(path,'utf8');
          if (!result.ok || result.jevVerifiedCalls < 3 || typedCalls < 3 ||
              !report.includes('Appels System One validés') || !report.includes('OpenJev')) {
            throw new Error('Full REA+Jev orchestration failed: '+JSON.stringify(result)+' calls '+typedCalls);
          }
          console.log('REA + simulated Jev integration:',JSON.stringify({rea:result.successCount,systemOneCalls:typedCalls,verified:result.jevVerifiedCalls}));
          NODE
